<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b12">
<title>SAEID ENGINE — Interactive Automotive Learning</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050b12;color:#fff;font-family:Arial,Helvetica,sans-serif;width:100%;min-height:100%;overflow-x:hidden}.wrap{width:100%;display:flex;justify-content:center;background:#050b12}.stage{position:relative;width:min(1536px,100vw);aspect-ratio:3/2;overflow:hidden;background:#07111c}.reference{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.hit,.system-hit,.start{position:absolute;z-index:4;border:0;background:transparent;cursor:pointer}.hit{border-radius:50%}.system-hit{border-radius:14px}.hit:focus-visible,.system-hit:focus-visible,.start:focus-visible{outline:2px solid #2cb2ff;outline-offset:-2px}.system-hit:hover{background:rgba(35,161,255,.08);box-shadow:inset 0 0 0 2px rgba(43,174,255,.85)}.toast{position:absolute;z-index:8;left:50%;bottom:25%;transform:translate(-50%,16px);padding:12px 18px;background:rgba(4,17,28,.94);border:1px solid #2f8ec7;border-radius:12px;font-size:15px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;box-shadow:0 10px 30px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.pulse{position:absolute;width:2.1%;aspect-ratio:1;border-radius:50%;border:2px solid #39b8ff;box-shadow:0 0 0 7px #119ef633,0 0 24px #119ef6;opacity:0;z-index:3;pointer-events:none}.pulse.on{opacity:1;animation:p 1s ease-out}@keyframes p{100%{box-shadow:0 0 0 18px #119ef600,0 0 30px #119ef644}}
@media(max-width:700px){.toast{font-size:12px;padding:9px 12px;bottom:18%}}
</style>
</head>
<body>
<div class="wrap"><main class="stage" id="stage" aria-label="SAEID ENGINE interactive automotive learning interface">
<img id="reference" class="reference" alt="SAEID ENGINE interactive automotive mechanics interface">
<button class="start" id="start" style="left:2.2%;top:30.3%;width:12.4%;height:4.7%" aria-label="Start Exploring"></button>
<button class="hit" data-name="Engine (V8)" style="left:33.2%;top:37.4%;width:2.2%;height:3.2%" aria-label="Engine V8"></button>
<button class="hit" data-name="Engine internals" style="left:27.1%;top:43.6%;width:2.2%;height:3.2%" aria-label="Engine internals"></button>
<button class="hit" data-name="Interior" style="left:49.4%;top:29.3%;width:2.2%;height:3.2%" aria-label="Interior"></button>
<button class="hit" data-name="Steering" style="left:60.8%;top:33.3%;width:2.2%;height:3.2%" aria-label="Steering"></button>
<button class="hit" data-name="Drivetrain" style="left:57.5%;top:42.9%;width:2.2%;height:3.2%" aria-label="Drivetrain"></button>
<button class="hit" data-name="Braking System" style="left:49.4%;top:58.0%;width:2.2%;height:3.2%" aria-label="Braking System"></button>
<button class="hit" data-name="Exhaust System" style="left:59.6%;top:52.9%;width:2.2%;height:3.2%" aria-label="Exhaust System"></button>
<button class="hit" data-name="Rear Suspension" style="left:74.2%;top:46.8%;width:2.2%;height:3.2%" aria-label="Rear Suspension"></button>

<button class="system-hit" data-name="Engine" style="left:3.9%;top:76.7%;width:7.9%;height:11.2%"></button>
<button class="system-hit" data-name="Transmission" style="left:12.2%;top:76.7%;width:7.5%;height:11.2%"></button>
<button class="system-hit" data-name="Suspension" style="left:20.2%;top:76.7%;width:7.6%;height:11.2%"></button>
<button class="system-hit" data-name="Braking System" style="left:28.4%;top:76.7%;width:7.7%;height:11.2%"></button>
<button class="system-hit" data-name="Steering" style="left:36.6%;top:76.7%;width:7.6%;height:11.2%"></button>
<button class="system-hit" data-name="Electrical System" style="left:44.9%;top:76.7%;width:7.5%;height:11.2%"></button>
<button class="system-hit" data-name="Cooling System" style="left:53.1%;top:76.7%;width:7.6%;height:11.2%"></button>
<button class="system-hit" data-name="Exhaust System" style="left:61.3%;top:76.7%;width:7.6%;height:11.2%"></button>
<button class="system-hit" data-name="Fuel System" style="left:69.5%;top:76.7%;width:7.6%;height:11.2%"></button>
<button class="system-hit" data-name="Interior" style="left:77.7%;top:76.7%;width:7.6%;height:11.2%"></button>
<button class="system-hit" data-name="Body Structure" style="left:85.9%;top:76.7%;width:9.3%;height:11.2%"></button>
<div id="toast" class="toast"></div><div id="pulse" class="pulse"></div>
</main></div>
<script src="./assets/reference-single.js"></script>
<script>
const ref=document.getElementById('reference');
const stage=document.getElementById('stage');
const toast=document.getElementById('toast');
const pulse=document.getElementById('pulse');
if(window.SAEID_REF){ref.src='data:image/webp;base64,'+window.SAEID_REF}else{stage.style.background='linear-gradient(135deg,#07111c,#0b2133)';toast.textContent='Reference artwork failed to load';toast.classList.add('show')}
let timer;
function showName(name,el){toast.textContent=name+' — click to explore';toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1400);if(el&&el.classList.contains('hit')){pulse.style.left=(parseFloat(el.style.left)+.05)+'%';pulse.style.top=(parseFloat(el.style.top)+.05)+'%';pulse.classList.remove('on');void pulse.offsetWidth;pulse.classList.add('on')}}
document.querySelectorAll('[data-name]').forEach(el=>el.addEventListener('click',()=>showName(el.dataset.name,el)));
document.getElementById('start').addEventListener('click',()=>showName('Choose any highlighted mechanical system'));
</script>
</body>
</html>
